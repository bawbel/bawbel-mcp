name: Feature request
description: A new tool, or a change to an existing tool's arguments or result.
title: "feat: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What an agent or user cannot do today.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposal
      description: Tool name, arguments, and result shape. Examples over prose.
    validations:
      required: true

  - type: textarea
    id: tool-surface
    attributes:
      label: Tool surface impact
      description: >-
        Tools added, removed, or changed. Say whether any tool would read private data,
        write anything, or reach a new network destination.
      value: |
        Tools added:
        Tools changed:
        Tools removed: none
        New data access, writes, or network destinations: none
    validations:
      required: true

name: Publish to PyPI

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      target:
        description: "Publish target"
        required: true
        default: "testpypi"
        type: choice
        options: [testpypi, pypi]

permissions:
  contents: read

jobs:

  # 1. Run tests
  test:
    name: Verify Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install deps
        run: pip install fastmcp bawbel-scanner pytest

      - name: Syntax check
        run: python -m py_compile bawbel_mcp/server.py && echo "Syntax OK"

  # 2. Build
  build:
    name: Build Distribution
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      - name: Install build tools
        run: pip install build twine

      - name: Build wheel and sdist
        run: python -m build

      - name: Verify distribution
        run: |
          twine check dist/*
          echo "=== Distribution contents ==="
          ls -lh dist/

      - name: Upload dist artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # 3. Publish to TestPyPI
  # publish-testpypi:
  #   name: Publish to TestPyPI
  #   runs-on: ubuntu-latest
  #   needs: build
  #   if: |
  #     github.event_name == 'release' ||
  #     (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'testpypi')
  #   environment:
  #     name: testpypi
  #     url: https://test.pypi.org/p/bawbel-mcp
  #   permissions:
  #     id-token: write

  #   steps:
  #     - name: Download dist
  #       uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
  #       with:
  #         name: dist
  #         path: dist/

  #     - name: Publish to TestPyPI
  #       uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
  #       with:
  #         repository-url: https://test.pypi.org/legacy/

  # 4. Publish to PyPI (requires manual approval)
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    # needs: publish-testpypi
    needs: build
    if: |
      github.event_name == 'release' ||
      (github.event_name == 'workflow_dispatch' && github.event.inputs.target == 'pypi')
    environment:
      name: pypi
      url: https://pypi.org/p/bawbel-mcp
    permissions:
      id-token: write

    steps:
      - name: Download dist
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2